# Pubblica una release quando si fa push di un tag vX.Y.Z:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Senza segreti l'app è firmata ad-hoc: funziona, ma al primo avvio macOS chiede conferma.
# Con i segreti qui sotto viene firmata con Developer ID e notarizzata da Apple:
#   MACOS_CERTIFICATE           certificato "Developer ID Application" in .p12, codificato in base64
#   MACOS_CERTIFICATE_PASSWORD  password del .p12
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   per notarytool (password specifica per app)
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Versione dal tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Importa il certificato Developer ID
        if: env.HAS_CERT == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "SIGN_ID=$IDENTITY" >> "$GITHUB_ENV"

      - name: Compila
        run: |
          [[ -n "${SIGN_ID:-}" ]] || export SIGN_ID=-
          UNIVERSAL=1 BUILD="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh

      - name: Notarizza
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "build/WhatsApp Bridge.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "build/WhatsApp Bridge.app"

      - name: Impacchetta
        run: |
          ZIP="WhatsApp-Bridge-$VERSION.zip"
          ditto -c -k --keepParent "build/WhatsApp Bridge.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HAS_CERT" == "true" && "$HAS_NOTARY" == "true" ]]; then
            INSTALL_NOTE="Signed with Developer ID and notarized by Apple: unzip it, move it to Applications and open it."
          else
            INSTALL_NOTE=$'This build is **not notarized**. After moving it to Applications, run once:\n\n```bash\nxattr -dr com.apple.quarantine "/Applications/WhatsApp Bridge.app"\n```\n\nor open it and confirm in System Settings › Privacy & Security › Open Anyway. You will need to grant Full Disk Access again after each update.'
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          Download \`$ZIP\`, unzip it and move **WhatsApp Bridge** to Applications. Requires macOS 26 or later. Works on Apple Silicon and Intel.

          $INSTALL_NOTE

          SHA-256: \`$(cut -d' ' -f1 "$ZIP.sha256")\`

          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "WhatsApp Bridge $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag

      - name: Pulisci il portachiavi
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
