# Release automatica.
#
# - Push su main: la versione si calcola dai commit dall'ultimo tag (Conventional Commits):
#   "feat:" → minore, "fix:"/"perf:" → patch, "tipo!:" o "BREAKING CHANGE" → maggiore.
#   Se ci sono solo docs/ci/chore/refactor non esce nessuna release.
#   Per saltare la release di un push, scrivi [skip release] nel messaggio dell'ultimo commit.
# - Push di un tag vX.Y.Z: rilascia esattamente quella versione.
# - "Run workflow" da GitHub: forza una release, scegliendo come aumentare la versione.
#
# Senza segreti l'app è firmata ad-hoc. Con questi segreti viene firmata con Developer ID e notarizzata:
#   MACOS_CERTIFICATE           certificato "Developer ID Application" in .p12, codificato in base64
#   MACOS_CERTIFICATE_PASSWORD  password del .p12
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   per notarytool (password specifica per app)
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Come aumentare la versione
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calcola la versione
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          else
            if [[ "$HEAD_MESSAGE" == *"[skip release]"* ]]; then
              echo "Release saltata: [skip release] nel commit."
              echo "SKIP=true" >> "$GITHUB_ENV"; exit 0
            fi
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            VERSION=$(./scripts/next-version.sh "$BUMP")
            if [[ -z "$VERSION" ]]; then
              echo "Nessuna modifica da rilasciare dall'ultimo tag (${PREVIOUS:-nessuno})."
              echo "SKIP=true" >> "$GITHUB_ENV"; exit 0
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "Il tag v$VERSION esiste già."
              echo "SKIP=true" >> "$GITHUB_ENV"; exit 0
            fi
          fi
          echo "Versione $VERSION (precedente: ${PREVIOUS:-nessuna})"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"

      - name: Importa il certificato Developer ID
        if: env.SKIP != 'true' && env.HAS_CERT == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "SIGN_ID=$IDENTITY" >> "$GITHUB_ENV"

      - name: Compila
        if: env.SKIP != 'true'
        run: |
          [[ -n "${SIGN_ID:-}" ]] || export SIGN_ID=-
          UNIVERSAL=1 BUILD="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh

      - name: Notarizza
        if: env.SKIP != 'true' && env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "build/Reply Radar.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "build/Reply Radar.app"

      - name: Impacchetta
        if: env.SKIP != 'true'
        run: |
          ZIP="Reply-Radar-$VERSION.zip"
          ditto -c -k --keepParent "build/Reply Radar.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Pubblica la release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-notes.sh > "$RUNNER_TEMP/notes.md" && cat "$RUNNER_TEMP/notes.md" && gh release create "v$VERSION" "$ZIP" "$ZIP.sha256" --target "$GITHUB_SHA" --title "Reply Radar $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Pulisci il portachiavi
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
